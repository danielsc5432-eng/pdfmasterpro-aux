name: Lightning CPU deployment contract
on:
  workflow_dispatch:
  push:
    branches: [main, feat/lightning-cpu]
    paths:
      - '.github/workflows/lightning-ai-contract.yml'
      - 'deploy/lightning-ai/**'
      - 'deploy/semantic-ai/**'
      - 'scripts/test-lightning-ai.py'
      - 'scripts/test-semantic-ai.py'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test private CPU bootstrap without model downloads
        run: python scripts/test-lightning-ai.py
      - name: Test authenticated serving contract without Torch
        run: |
          python -m pip install -r deploy/semantic-ai/requirements-test.txt
          python scripts/test-semantic-ai.py
